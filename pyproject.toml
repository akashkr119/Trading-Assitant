[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-assistant"
version = "0.1.0"
description = "Explainable trading decision-support engine for Indian equities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5,<7",
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "pydantic>=2.8,<3",
    "streamlit>=1.38,<2",
    "truststore>=0.10,<1",
    "yfinance>=0.2,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E501"]
"pages/1_📈_NSE_Intraday.py" = ["E501"]
"pages/6_🧪_Crypto_Validation.py" = ["I001"]
"pages/7_🧪_NSE_Intraday_Validation.py" = ["E501", "I001"]
