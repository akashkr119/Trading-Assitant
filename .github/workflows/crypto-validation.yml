name: Crypto Engine Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-engine-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout validation state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run one validation cycle
        run: python tools/crypto_validation_runner.py --once

      - name: Persist validation journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/crypto_validation_journal.csv
          if git diff --cached --quiet; then
            echo "No validation state changed."
            exit 0
          fi
          git commit -m "chore: update crypto validation state"
          git push origin HEAD:${GITHUB_REF_NAME}
