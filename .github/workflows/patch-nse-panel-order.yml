name: Patch NSE live panel order

on:
  push:
    branches:
      - fix/nse-live-panel-order

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/nse-live-panel-order

      - name: Move live panel placeholder above swing scanner
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          anchor = '''    if not candidates and not market_open:\n        st.warning("NSE regular session is closed. Intraday scanner is paused.")\n\n    st.divider()\n    st.subheader("📅 Swing Trading Scanner")'''
          replacement = '''    if not candidates and not market_open:\n        st.warning("NSE regular session is closed. Intraday scanner is paused.")\n\n    intraday_live_slot = st.empty()\n\n    st.divider()\n    st.subheader("📅 Swing Trading Scanner")'''
          if anchor not in text:
              raise SystemExit("Could not find swing scanner anchor")
          text = text.replace(anchor, replacement, 1)

          old = '''if connected and st.session_state.nse_intraday_selected:\n    selected_nse_intraday_panel()'''
          new = '''if connected and st.session_state.nse_intraday_selected:\n    with intraday_live_slot.container():\n        selected_nse_intraday_panel()'''
          if old not in text:
              raise SystemExit("Could not find selected NSE panel call")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/patch-nse-panel-order.yml
          git commit -m "fix: render NSE live panel above swing scanner"
          git push origin HEAD:fix/nse-live-panel-order